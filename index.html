<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <h1>Симулютор бизнес мена</h1>
        <section class="head">
            <div>
                <a href="">Заработать денег</a>
            </div>
            <div>
                <a href="">Купить ферму</a>
            </div>
            <div>
                <a href="">Статистика</a>
            </div>
        </section>
        <div class="balance-container">
            <p>Ваш баланс: <span>0</span> крышек</p>
        </div>

    </header>
    <main>
        <div class="Card">
            <h3>Плохой пальчик</h3>
            <img src="tree.jpeg" alt="">
            <p>+5 к нажатию!</p>
            <div class="price-card">
                100 крышек
            </div>
            <button class="BuyBut">Купить</button>
        </div>
        <div class="Card">
            <h3>Хороший пальчик</h3>
            <img src="iron.jpeg" alt="">
            <p>+10 к нажатию!</p>
            <div class="price-card">
                500 крышек
            </div>
            <button class="BuyBut">Купить</button>
        </div>
        <div class="Card">
            <h3>Лучший пальчик</h3>
            <img src="gold.jpeg" alt="">
            <p>+30 к нажатию!</p>
            <div class="price-card">
                2000 крышек
            </div>
            <button class="BuyBut">Купить</button>
        </div>
        <div class="Card">
            <h3>Супер пальчик</h3>
            <img src="daimon.jpeg" alt="">
            <p>+100 к нажатию!</p>
            <div class="price-card">
                50000 крышек
            </div>
            <button class="BuyBut">Купить</button>
        </div>


    </main>

    <script src="app.js"></script>
</body>
</html>
