<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="farm.css">
</head>
<body>
    
    <header>
        <h1>Симулятор бизнес мена</h1>
        <section class="head">
            
            <a href="click.html">Заработать денег</a>
            
            <a href="">Купить пальчик</a>
            
            <a href="">Статистика</a>
            
        </section>
        <div class="balance-container">
            <p>Ваш баланс: <span>0</span> крышек</p>
        </div>

    </header>
    <main>
        <div class="Card">
            <h3>Ферма моркови</h3>
            <img src="carrot.jpeg" alt="">
            <p>5 в минуту</p>
            <div class="price-card">
                100 крышек
            </div>
            <button class="BuyBut">Купить</button>
        </div>
        <div class="Card">
            <h3>Ферма листов</h3>
            <img src="iron.jpeg" alt="">
            <p>50 в минуту</p>
            <div class="price-card">
                500 крышек
            </div>
            <button class="BuyBut">Купить</button>
        </div>
        <div class="Card">
            <h3>Ферма электроэнергии</h3>
            <img src="gold.jpeg" alt="">
            <p>200 в минуту</p>
            <div class="price-card">
                2000 крышек
            </div>
            <button class="BuyBut">Купить</button>
        </div>
        <div class="Card">
            <h3>Ферма планет</h3>
            <img src="daimon.jpeg" alt="">
            <p>1000 в минуту</p>
            <div class="price-card">
                50000 крышек
            </div>
            <button class="BuyBut">Купить</button>
        </div>


    </main>

    <script src="farm.js"></script>
</body>
</html>
